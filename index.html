<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Card</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="card">
      <img
        id="productImage"
        src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500"
        alt="Product"
        onmouseover="changeImage()"
        onmouseout="originalImage()"
      />    

      <h2 id="productName">Nike Shoes</h2>
      <p id="productDescription">
        Comfortable and stylish shoes for everyday use.
      </p>
      <h3 id="productPrice">1200</h3>
      <button onclick="buyNow()">Buy Now</button>
      <button onclick="changeProduct()">Change Product</button>
      <hr />
      <input type="text" id="userName" placeholder="Enter your name" />
      <button onclick="showWelcome()">Welcome</button>
      <p id="welcomeMessage"></p>
      <hr />
      <button onclick="changeDetails()">Change Product Details</button>
    </div>

    <script src="app.js"></script>
  </body>
</html>
