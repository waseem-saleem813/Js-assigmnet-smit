<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Card</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Image 1 -->
    <img id="img1" src="https://picsum.photos/id/10/200/150" width="200">
    <button onclick="swapPic('img1', 'https://picsum.photos/id/20/200/150')">
        Button 1
    </button>

    <br><br>
    <!-- Image 2 -->
    <img id="img2" src="https://picsum.photos/id/30/200/150" width="200">
    <button onclick="swapPic('img2', 'https://picsum.photos/id/40/200/150')">
        Button 2
    </button>
    <br><br>
    <!-- Image 3 -->
    <img id="img3" src="https://picsum.photos/id/50/200/150" width="200">
    <button onclick="swapPic('img3', 'https://picsum.photos/id/60/200/150')">
        Button 3
    </button>

    
    <script>
        function swapPic(imageId, newImage) {
            document.getElementById(imageId).src = newImage;
        }
    </script>
  </body>
</html>
